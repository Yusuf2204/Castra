# ============================================================
# React CMS — Nginx Reverse Proxy
# ============================================================
# Routes:
#   /       → frontend (React SPA)
#   /api/*  → backend  (Laravel)
# ============================================================

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:80;
}

server {
    listen       80;
    server_name  _;

    # allow larger uploads (logos, favicons)
    client_max_body_size 10M;

    # ── Frontend ─────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend API ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Swagger UI assets + JSON docs ─────────────────────────
    # Swagger UI at /api/documentation loads the JSON via
    # /docs?jsonFile=api-docs.json and its assets via
    # /docs/asset/* — route those to the backend too.
    location = /docs {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

}
