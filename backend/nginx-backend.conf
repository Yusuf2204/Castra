# ── React CMS Backend — Internal Nginx + PHP-FPM ─────────────
# Serves Laravel application. This is behind the reverse proxy.

server {
    listen       80;
    server_name  _;

    client_max_body_size 10M;

    root   /var/www/html/public;
    index  index.php;

    # security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # gzip compression for fast delivery of Swagger assets and API payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # ── Laravel routing ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # FastCGI memory buffers (prevents disk spill for large responses like Swagger UI assets)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 16 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 120s;
    }

    # deny hidden files
    location ~ /\. {
        deny all;
    }
}
